# Netlify builds this for you — you never need npm on your own machine.
[build]
  command = "node tools/sync.js"   # mirrors shared/ into public/shared before publishing
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# Single API entry point; the action is in the POST body.
[[redirects]]
  from = "/api"
  to = "/.netlify/functions/api"
  status = 200
