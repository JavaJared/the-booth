# No build step: the site is plain ES modules, served as-is.
[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  # firebase-admin resolves parts of itself at runtime (grpc, protobuf
  # descriptors), which esbuild cannot follow statically. Bundling it produces
  # a function that crashes on first call with an opaque 502. Leaving it
  # external ships the real package instead.
  external_node_modules = ["firebase-admin"]

# Single API entry point; the action is in the POST body.
[[redirects]]
  from = "/api"
  to = "/.netlify/functions/api"
  status = 200
