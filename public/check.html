<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Booth — connection check</title>
<link rel="stylesheet" href="styles.css">
<style>
  body{padding:2rem 1.25rem}
  .wrap{max-width:44rem;margin:0 auto}
  h1{font-family:var(--cond);text-transform:uppercase;letter-spacing:.04em;font-size:2rem;margin:0 0 .3rem}
  .step{background:var(--pad);border:1px solid var(--ink);border-radius:2px;
    padding:.7rem .85rem;margin-bottom:.55rem;display:flex;gap:.8rem;align-items:flex-start}
  .step .mark{font-family:var(--mono);font-weight:700;flex:none;width:1.6rem;text-align:center}
  .step.pass .mark{color:#2F7D4F}
  .step.fail .mark{color:var(--pencil)}
  .step.run .mark{color:var(--ink-3)}
  .step b{display:block;font-size:.95rem}
  .step p{margin:.15rem 0 0;font-size:.83rem;color:var(--ink-2);line-height:1.45}
  .step code{font-family:var(--mono);font-size:.78rem;background:rgba(217,227,230,.5);
    padding:.05rem .3rem;border-radius:2px;word-break:break-all}
  .fix{margin-top:.4rem;font-family:var(--hand);font-size:1.1rem;color:var(--pencil)}
  .raw{margin:.5rem 0 0;padding:.5rem .6rem;background:#F2F5F2;border:1px solid var(--hair);
    border-radius:2px;font-family:var(--mono);font-size:.72rem;line-height:1.5;
    white-space:pre-wrap;word-break:break-all;max-height:11rem;overflow:auto;color:var(--ink-2)}
  .raw b{color:var(--ink);font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Diagnostics</p>
  <h1>Connection check</h1>
  <p class="lede">Each layer is tested on its own, so a failure points at one thing
    to fix rather than leaving you guessing.</p>
  <div id="steps"></div>
  <p class="scout-note" style="padding:0;margin-top:1rem">Diagnostic build 4.
    If you do not see this line, your browser is serving a cached copy &mdash;
    add <code>?v=4</code> to the address.</p>
  <p style="margin-top:1.5rem"><a href="/" class="btn">Back to the game</a></p>
</div>

<script type="module">
const box = document.getElementById('steps');
function step(title) {
  const el = document.createElement('div');
  el.className = 'step run';
  el.innerHTML = `<span class="mark">…</span><div><b>${title}</b><p></p></div>`;
  box.append(el);
  return {
    pass: (msg) => { el.className = 'step pass'; el.querySelector('.mark').textContent = '✓';
      el.querySelector('p').innerHTML = msg || ''; },
    fail: (msg, fix) => { el.className = 'step fail'; el.querySelector('.mark').textContent = '✕';
      el.querySelector('p').innerHTML = msg + (fix ? `<span class="fix">${fix}</span>` : ''); },
    // Evidence on the page, for devices where devtools are not available.
    show: (label, text) => {
      const pre = document.createElement('pre');
      pre.className = 'raw';
      pre.innerHTML = `<b>${label}</b>\n` + String(text)
        .slice(0, 700).replace(/&/g, '&amp;').replace(/</g, '&lt;');
      el.querySelector('div').append(pre);
    },
  };
}

// Anything unhandled lands on the page rather than only in the console.
// `stop` is how halt() unwinds a failed check; it is not a real error.
const realError = (m) => m && m !== 'stop' && !/^Error: stop$/.test(m);
addEventListener('error', (e) => {
  const m = e.message || String(e.error);
  if (realError(m)) step('Unexpected error').fail(m);
});
addEventListener('unhandledrejection', (e) => {
  const m = e.reason?.message || String(e.reason);
  if (realError(m)) step('Unexpected error').fail(m);
});
const halt = (s, msg, fix) => { s.fail(msg, fix); throw new Error('stop'); };

(async () => {
  // 1 — config file. Several very different failures used to look identical
  // here, so fetch the raw file first and name the actual problem.
  const s1 = step('firebase-config.js is present');
  let cfg;
  try {
    let raw = null, status = 0, ctype = '';
    try {
      const res = await fetch('./firebase-config.js?v=' + Date.now(), { cache: 'no-store' });
      status = res.status;
      ctype = res.headers.get('content-type') || '';
      raw = await res.text();
    } catch (netErr) {
      halt(s1, `Could not reach the file at all: <code>${netErr.message}</code>`,
        'Are you offline, or is the site itself not loading?');
    }
    const evidence = () => s1.show(
      `GET /firebase-config.js  →  ${status}  ${ctype.split(';')[0]}`,
      raw && raw.trim() ? raw : '(empty response)');

    if (status === 404) {
      evidence();
      halt(s1, 'The server returned <b>404</b> for <code>/firebase-config.js</code>.',
        'The file is not inside the published folder. On GitHub it must sit at ' +
        'public/firebase-config.js — check the breadcrumb above the file contents. ' +
        'If the path is right, the deploy has not finished; wait for Netlify to publish.');
    }
    if (raw !== null && /<!DOCTYPE html/i.test(raw)) {
      evidence();
      halt(s1, 'That path returns the site&rsquo;s HTML, not JavaScript.',
        'Netlify is falling back to index.html, which means the file is not there. Check the path.');
    }
    // The Firebase console hands you a full snippet, imports and all. Those
    // imports use bare specifiers, which a browser cannot resolve without a
    // bundler — so the file must hold the config object and nothing else.
    const bare = raw && raw.match(/import\s[^;]*?from\s+['"](firebase\/[\w-]+)['"]/);
    if (bare) {
      evidence();
      halt(s1, `The file contains <code>import … from "${bare[1]}"</code>, which a browser cannot resolve.`,
        'You pasted the whole snippet from the Firebase console. Delete every import line and the ' +
        'initializeApp / getAnalytics lines. Keep only the config object, with export in front of it. ' +
        'app.js loads the SDK from a CDN by itself.');
    }
    if (raw && /initializeApp\s*\(/.test(raw)) {
      evidence();
      halt(s1, 'The file calls <code>initializeApp()</code>.',
        'That belongs in app.js, not here. This file should contain only: export const firebaseConfig = { … };');
    }

    if (raw !== null && !/export\s+(const|let|var)\s+firebaseConfig/.test(raw)) {
      const hasConst = /const\s+firebaseConfig/.test(raw);
      evidence();
      halt(s1, hasConst
        ? 'The file is served, but the config is not exported.'
        : 'The file is served, but no <code>firebaseConfig</code> declaration was found in it.',
        hasConst
          ? 'Firebase&rsquo;s console shows "const firebaseConfig = {...}". Add export in front: "export const firebaseConfig = {...}".'
          : 'Paste the config object from Firebase &rarr; Project settings &rarr; Your apps, prefixed with export const firebaseConfig =');
    }

    cfg = (await import('./firebase-config.js?v=' + Date.now())).firebaseConfig;
    if (!cfg) {
      evidence();
      halt(s1, 'The file loaded but exported nothing named <code>firebaseConfig</code>.',
        'The export name must be exactly firebaseConfig.');
    }
    if (!cfg.apiKey || String(cfg.apiKey).startsWith('...')) {
      halt(s1, 'The file loaded but still holds the example placeholders.',
        'Replace them with your real values. These keys are public by design.');
    }
    if (!cfg.projectId) {
      halt(s1, 'The config has no <code>projectId</code>.', 'Copy the whole object from the Firebase console.');
    }
    s1.pass(`Project <code>${cfg.projectId}</code>`);
  } catch (e) {
    if (e.message === 'stop') return;
    // A genuine parse error inside the file lands here.
    try { evidence(); } catch {}
    halt(s1, `The file exists but failed to load: <code>${e.message}</code>`,
      'Usually a syntax error — a smart quote from copy-paste, a stray character, ' +
      'or a missing comma. Open /firebase-config.js directly and read it.');
  }

  // 2 — SDK
  const s2 = step('Firebase SDK loads from the CDN');
  let app, auth, fs;
  try {
    const [a, b, c] = await Promise.all([
      import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js'),
      import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js'),
    ]);
    app = a.initializeApp(cfg); auth = b; fs = c;
    s2.pass('All three modules loaded.');
  } catch (e) {
    if (e.message === 'stop') return;
    halt(s2, e.message, 'Usually a network block or an ad blocker on gstatic.com.');
  }

  // 3 — anonymous auth
  const s3 = step('Anonymous sign-in is enabled');
  let user, token;
  try {
    const a = auth.getAuth(app);
    user = (await auth.signInAnonymously(a)).user;
    token = await user.getIdToken();
    s3.pass(`Signed in as <code>${user.uid}</code>`);
  } catch (e) {
    if (e.message === 'stop') return;
    halt(s3, `${e.code || ''} ${e.message}`,
      'Firebase console → Authentication → Sign-in method → Anonymous → Enable.');
  }

  // 4 — the serverless function is deployed
  const s4 = step('The /api function responds');
  let ping;
  try {
    const res = await fetch('/api', {
      method: 'POST',
      headers: { 'content-type': 'application/json', authorization: `Bearer ${token}` },
      body: JSON.stringify({ action: 'ping', data: {} }),
    });
    const text = await res.text();
    let body = {};
    try { body = JSON.parse(text); } catch { /* not JSON — show it raw below */ }

    if (!res.ok) {
      s4.show(`POST /api  →  ${res.status}`, text.trim() || '(empty response body)');
      const err = body.error || body.errorMessage || '';
      if (res.status === 404) {
        halt(s4, 'Netlify returned 404 — the function is not deployed.',
          'Check that netlify/functions/api.js and netlify/functions/package.json are both committed, ' +
          'and that the deploy log lists a bundled function named api.');
      }
      if (res.status === 401) {
        halt(s4, 'The function rejected your sign-in token.',
          'FIREBASE_PROJECT_ID in Netlify must match the projectId in firebase-config.js.');
      }
      if (/Missing environment variable/i.test(err)) {
        halt(s4, err, 'Add them, then trigger a fresh deploy — Netlify reads them at build time.');
      }
      if (/PRIVATE_KEY|PEM|DECODER/i.test(err + text)) {
        halt(s4, err || 'The private key could not be parsed.',
          'Re-paste FIREBASE_PRIVATE_KEY whole, including the BEGIN and END lines.');
      }
      if (/Cannot find package|ERR_MODULE_NOT_FOUND|Cannot find module/i.test(text)) {
        const pkg = (text.match(/Cannot find (?:package|module) '([^']+)'/) || [])[1] || 'a dependency';
        halt(s4, `The function could not load <code>${pkg}</code> — it was never installed.`,
          'Netlify installs dependencies from the package.json at the repo ROOT, not the one inside ' +
          'netlify/functions. Add "firebase-admin": "^12.6.0" to the dependencies of the root ' +
          'package.json, commit, and redeploy. The deploy log should then show it being installed.');
      }
      if (res.status === 502 || !text.trim()) {
        halt(s4, 'The function crashed before it could answer (502).',
          'Most often the firebase-admin bundle. Confirm netlify.toml contains ' +
          'external_node_modules = ["firebase-admin"] under [functions], then redeploy. ' +
          'The real stack trace is at Netlify → Deploys → your deploy → Functions → api.');
      }
      halt(s4, `${res.status}: ${err || 'no error message returned'}`,
        'Netlify → Deploys → Functions → api, for the stack trace.');
    }
    ping = body.data;
    s4.pass(`Admin credentials reached Firestore. Server project <code>${ping.projectId}</code>.`);
    if (ping.projectId && ping.projectId !== cfg.projectId) {
      s4.show('Project mismatch',
        `browser: ${cfg.projectId}\nserver:  ${ping.projectId}\n` +
        'These must match or reads and writes will hit different databases.');
    }
  } catch (e) {
    if (e.message === 'stop') return;
    halt(s4, e.message,
      '"Failed to fetch" here usually means the site deployed without the function.');
  }

  // 5 — round trip through the real game path
  const s5 = step('A game can be created and read back');
  try {
    const res = await fetch('/api', {
      method: 'POST',
      headers: { 'content-type': 'application/json', authorization: `Bearer ${token}` },
      body: JSON.stringify({ action: 'createGame', data: { seat: 'DC', displayName: 'Diagnostic' } }),
    });
    const body = await res.json();
    if (!res.ok) halt(s5, body.error, 'The write failed. Check the function logs.');
    const gameId = body.data.gameId;

    const db = fs.getFirestore(app);
    const snap = await fs.getDoc(fs.doc(db, 'games', gameId));
    if (!snap.exists()) halt(s5, 'The game was written but reads back empty.');
    s5.pass(`Created and read game <code>${gameId}</code> seated at DC.`);

    // 6 — rules actually deny what they should
    const s6 = step('Security rules block client writes');
    try {
      await fs.updateDoc(fs.doc(db, 'games', gameId), { 'state.score.us': 99 });
      s6.fail('A client just wrote to the game document.',
        'Publish firestore.rules in the console. Right now anyone can award themselves points.');
    } catch {
      s6.pass('Writes are refused, as they should be.');
    }
  } catch (e) {
    if (e.message === 'stop') return;
    const s6 = step('Security rules');
    s6.fail(e.message,
      /permission|insufficient/i.test(e.message)
        ? 'Reads are being denied. Publish the firestore.rules from this repo.'
        : '');
  }

  const done = document.createElement('p');
  done.className = 'field-note';
  done.style.textAlign = 'left';
  done.textContent = 'All green means two-player exhibition games will work.';
  box.append(done);
})();
</script>
</body>
</html>
